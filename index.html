<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paper Wings — fold, fly, survive</title>
  <meta name="description" content="A one-button paper-plane flyer. Every day brings a new sky. Free, no install, runs in your browser." />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9657119821733951" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font: 16px/1.6 system-ui, -apple-system, sans-serif; color: #2a2440; text-align: center;
      background: linear-gradient(#b06a4a, #e8b08a);
    }
    main { padding: 40px 24px; }
    h1 { font-size: 52px; margin: 0; letter-spacing: .5px; }
    h1 span { color: #ffffff; }
    .sky { margin: 10px 0 26px; color: #fff7ef; font-size: 15px; }
    #sky { text-shadow: 0 1px 2px rgba(0, 0, 0, .25); } /* pale inks (Milk, Salt) must survive the light end of the gradient */
    .play {
      display: inline-block; background: #ff6b6b; color: #fff; text-decoration: none;
      font-weight: 700; font-size: 20px; padding: 16px 42px; border-radius: 14px;
      box-shadow: 0 10px 30px rgba(30, 20, 10, .25);
    }
    .play:hover { filter: brightness(1.06); }
    .how { margin: 22px auto 0; max-width: 420px; color: #5c5470; font-size: 14px; }
    footer { margin-top: 34px; font-size: 12px; color: #6f6783; }
    footer a { color: inherit; }
  </style>
  <link rel="prefetch" href="/paper-wings/" />
  <link rel="prefetch" href="/paper-wings/css/style.css" />
  <link rel="prefetch" href="/paper-wings/js/three.module.min.js" />
  <link rel="prefetch" href="/paper-wings/js/logic.js?v=15" />
  <link rel="prefetch" href="/paper-wings/js/game.js" />
  <link rel="prefetch" href="/paper-wings/js/main.js" />
  <link rel="prefetch" href="/paper-wings/js/ads.js" />
  <link rel="prefetch" href="/paper-wings/js/share.js" />
  <link rel="prefetch" href="/paper-wings/js/lib/GLTFLoader.js" />
  <link rel="prefetch" href="/paper-wings/js/lib/BufferGeometryUtils.js" />
  <link rel="prefetch" href="/paper-wings/assets/rocket.glb" />

</head>
<body>
  <main>
    <h1>Paper <span>Wings</span></h1>
    <p class="sky">today's sky — <b id="sky">loading…</b></p>
    <a class="play" href="/paper-wings/?play=1">Take flight</a>
    <p class="how">Hold to rise, release to dive, steer with your pointer.
      Thread golden rings, graze the blades, don't fold.
      Every day has its own sky — everyone flying today flies the same one.</p>
    <footer>
      <a href="/paper-wings/privacy.html">Privacy</a> ·
      <a href="https://github.com/awsdemo006yohei-afk/paper-wings">source</a>
    </footer>
  </main>
  <script type="module">
    import { dailyTheme, themeInk } from '/paper-wings/js/logic.js?v=15';
    const theme = dailyTheme(new Date().toISOString().slice(0, 10));
    const sky = document.getElementById('sky');
    sky.textContent = theme.name;
    sky.style.color = themeInk(theme.name, theme.palette.accent); // the name wears the color it says
  </script>
</body>
</html>
